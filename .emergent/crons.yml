crons:
  - name: iscritti-tick
    description: "Elenco Iscritti: riprova le sincronizzazioni Brevo fallite e anonimizza gli iscritti senza partecipazioni da oltre 5 anni"
    cron: "30 3 * * *"
    timezone: "Europe/Rome"
    endpoint: "{{BASE_URL}}/api/cron/iscritti-tick"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: calendar-availability-tick
    description: "Controlla ogni 15 minuti la disponibilità sui calendari Google monitorati (solo free/busy) e aggiorna stato ed errori"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/calendar-availability-tick"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: brevo-funnel-tick
    description: "Processes due Demo funnel emails every 15 min, re-checking stop conditions before each send"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/brevo-funnel-tick"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: saas-trial-tick
    description: "Sends GOLD trial reminders (3 days before and on expiry day) and marks expired trials"
    cron: "0 8 * * *"
    timezone: "Europe/Rome"
    endpoint: "{{BASE_URL}}/api/cron/saas-trial-tick"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: event-renewals
    description: "Charges monthly Event Maintenance credits for active events, suspends if balance is insufficient"
    cron: "0 3 * * *"
    endpoint: "{{BASE_URL}}/api/cron/event-renewals"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: cal-italia-sync
    description: "Calendario Eventi Italia: sincronizza ogni notte alle 03:00 solo le fonti con accesso verificato come consentito e attive"
    cron: "0 3 * * *"
    timezone: "Europe/Rome"
    endpoint: "{{BASE_URL}}/api/cron/cal-italia-sync"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: cal-italia-auto-send
    description: "Calendario Eventi Italia: ogni giorno alle 10:00 invia l'email post-evento agli organizzatori idonei (stessi controlli dell'anteprima)"
    cron: "0 10 * * *"
    timezone: "Europe/Rome"
    endpoint: "{{BASE_URL}}/api/cron/cal-italia-auto-send"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: press-tick
    description: "Comunicati stampa: bozze post-evento, invii programmati approvati, ripresa invii interrotti, sync Brevo"
    cron: "*/10 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/press-tick"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true

